<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eaf0fa"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173b72"/><stop offset="1" stop-color="#4d7bc3"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7a90"/></marker>
    <style>.title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#173b72}.label{font:700 18px 'Microsoft YaHei',sans-serif;fill:#fff}.sub{font:14px 'Microsoft YaHei',sans-serif;fill:#dce8fb}.dark{font:700 18px 'Microsoft YaHei',sans-serif;fill:#20324d}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#5c6b80}.line{stroke:#6b7a90;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="55" text-anchor="middle" class="title">企业级智能知识库问答系统 - 总体架构</text>
  <g filter="url(#shadow)">
    <rect x="55" y="130" rx="18" width="210" height="145" fill="url(#primary)"/>
    <text x="160" y="178" text-anchor="middle" class="label">Streamlit Web</text>
    <text x="160" y="210" text-anchor="middle" class="sub">登录 · 知识库管理</text><text x="160" y="235" text-anchor="middle" class="sub">文档上传 · RAG 对话</text>
    <rect x="365" y="105" rx="18" width="260" height="195" fill="#fff"/>
    <text x="495" y="150" text-anchor="middle" class="dark">FastAPI 应用层</text>
    <text x="495" y="185" text-anchor="middle" class="small">JWT 鉴权与用户隔离</text><text x="495" y="210" text-anchor="middle" class="small">文档 / 检索 / 问答 API</text><text x="495" y="235" text-anchor="middle" class="small">请求追踪与异常处理</text><text x="495" y="260" text-anchor="middle" class="small">OpenAPI / 健康检查</text>
    <rect x="735" y="105" rx="18" width="230" height="195" fill="#fff"/>
    <text x="850" y="150" text-anchor="middle" class="dark">RAG 服务层</text>
    <text x="850" y="185" text-anchor="middle" class="small">文档解析与分块</text><text x="850" y="210" text-anchor="middle" class="small">混合检索 + RRF</text><text x="850" y="235" text-anchor="middle" class="small">重排序与证据门控</text><text x="850" y="260" text-anchor="middle" class="small">Prompt 与引用生成</text>
    <rect x="1045" y="130" rx="18" width="180" height="145" fill="url(#primary)"/>
    <text x="1135" y="178" text-anchor="middle" class="label">模型服务</text>
    <text x="1135" y="210" text-anchor="middle" class="sub">Chat Model</text><text x="1135" y="235" text-anchor="middle" class="sub">Embedding Model</text>
    <rect x="210" y="430" rx="18" width="240" height="155" fill="#fff"/>
    <text x="330" y="478" text-anchor="middle" class="dark">PostgreSQL + pgvector</text>
    <text x="330" y="513" text-anchor="middle" class="small">用户 / 知识库 / 会话</text><text x="330" y="538" text-anchor="middle" class="small">向量索引 HNSW</text><text x="330" y="563" text-anchor="middle" class="small">全文索引 GIN</text>
    <rect x="520" y="430" rx="18" width="200" height="155" fill="#fff"/>
    <text x="620" y="478" text-anchor="middle" class="dark">Redis</text>
    <text x="620" y="513" text-anchor="middle" class="small">Celery Broker</text><text x="620" y="538" text-anchor="middle" class="small">任务结果后端</text>
    <rect x="790" y="430" rx="18" width="210" height="155" fill="#fff"/>
    <text x="895" y="478" text-anchor="middle" class="dark">Celery Worker</text>
    <text x="895" y="513" text-anchor="middle" class="small">异步解析</text><text x="895" y="538" text-anchor="middle" class="small">Embedding 入库</text>
    <rect x="1060" y="430" rx="18" width="165" height="155" fill="#fff"/>
    <text x="1142" y="478" text-anchor="middle" class="dark">文件存储</text>
    <text x="1142" y="513" text-anchor="middle" class="small">Docker Volume</text><text x="1142" y="538" text-anchor="middle" class="small">原始文档</text>
  </g>
  <path d="M265 202 H365" class="line"/><path d="M625 202 H735" class="line"/><path d="M965 202 H1045" class="line"/>
  <path d="M470 300 C440 360 370 370 340 430" class="line"/><path d="M520 300 C550 350 600 370 615 430" class="line"/><path d="M850 300 V430" class="line"/><path d="M920 300 C1000 350 1090 365 1130 430" class="line"/>
  <path d="M720 507 H790" class="line"/>
  <text x="640" y="660" text-anchor="middle" class="small">Docker Compose 本地一键启动 · 模型接口与业务逻辑解耦 · 用户级数据隔离</text>
</svg>
